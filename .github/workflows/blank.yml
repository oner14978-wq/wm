name: Windows Remoto no GitHub (Tailscale + RDP + Migração)

on:
  workflow_dispatch:
    inputs:
      acao:
        description: "Ação"
        type: choice
        default: ligar
        options:
          - criar
          - status
          - ligar
          - desligar
          - reiniciar
          - destruir
          - backup
          - restaurar
          - migrar
          - verificar_backup
      runner:
        description: "Tipo de runner"
        type: choice
        default: windows-11-arm
        options:
          - windows-11-arm
          - windows-11-arm
      minutos:
        description: "Minutos ligado (máx. 340)"
        type: string
        default: "300"
      nome_pc:
        description: "Nome na rede Tailscale"
        type: string
        default: pc-github
      migrar_aos:
        description: "Minuto em que inicia a migração (290 = 4h50)"
        type: string
        default: "290"
      origem_run:
        description: "Uso interno: ID da execução antiga (deixe vazio)"
        type: string
        default: ""
      confirmar_destruir:
        description: "Para 'destruir', escreva DESTRUIR"
        type: string
        default: ""

permissions:
  contents: read
  actions: write

env:
  # Armazenamento persistente (rclone). O remote deve se chamar "armazenamento".
  # Troque "pc-gamer" pelo bucket/pasta que você quiser.
  REMOTE: "armazenamento:pc-gamer"
  BACKUP_PATHS: 'C:\Users\Rafael;C:\Games'
  INTERVALO_BACKUP_MIN: "10"
  GRACA_MIN: "10"

jobs:
  # ---------------------------------------------------------------
  # Ações de controle (não precisam de Windows): falam com o PC
  # ligado pelo armazenamento persistente.
  # ---------------------------------------------------------------
  controle:
    if: ${{ contains(fromJSON('["criar","status","desligar","reiniciar","destruir","backup","migrar","verificar_backup"]'), inputs.acao) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      GH_TOKEN: ${{ github.token }}
      ACAO: ${{ inputs.acao }}
      RUNNER_TIPO: ${{ inputs.runner }}
      MINUTOS: ${{ inputs.minutos }}
      NOME_PC: ${{ inputs.nome_pc }}
      MIGRAR_AOS: ${{ inputs.migrar_aos }}
      CONFIRMAR: ${{ inputs.confirmar_destruir }}
    steps:
      - name: Executar ação
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${RCLONE_CONFIG:-}" ] && [ -z "${RCLONE_CONFIG_B64:-}" ]; then echo "Secret RCLONE_CONFIG ausente."; exit 1; fi
          curl -fsSL https://rclone.org/install.sh | sudo bash >/dev/null 2>&1 || true
          command -v rclone >/dev/null || { echo "Falha ao instalar rclone."; exit 1; }
          mkdir -p ~/.config/rclone
          if [ -n "${RCLONE_CONFIG:-}" ]; then printf '%s\n' "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          else echo "$RCLONE_CONFIG_B64" | base64 -d > ~/.config/rclone/rclone.conf; fi
          R="$REMOTE"

          get() { rclone cat "$R/state/$1.json" 2>/dev/null; }

          alive() {
            c="$(get current)"; [ -n "$c" ] || return 1
            st="$(echo "$c" | jq -r .status)"; [ "$st" != "desligado" ] || return 1
            ls="$(echo "$c" | jq -r .last_seen)"
            age=$(( $(date +%s) - $(date -d "$ls" +%s) ))
            [ "$age" -lt 900 ]
          }

          send() {
            id="$(date +%s)-$RANDOM"
            echo "{\"id\":\"$id\",\"acao\":\"$1\",\"por\":\"$GITHUB_ACTOR\"}" | rclone rcat "$R/state/command.json"
            end=$(( $(date +%s) + $2 ))
            while [ "$(date +%s)" -lt "$end" ]; do
              a="$(get ack)"
              if [ -n "$a" ] && [ "$(echo "$a" | jq -r .id)" = "$id" ]; then
                echo "$a" | jq .
                [ "$(echo "$a" | jq -r .ok)" = "true" ]
                return
              fi
              sleep 15
            done
            echo "Sem resposta do PC no tempo esperado."
            return 1
          }

          need_alive() { alive || { echo "Nenhum PC ativo no momento. Use a ação 'ligar'."; exit 1; }; }

          WF="$(basename "${GITHUB_WORKFLOW_REF%%@*}")"

          case "$ACAO" in
            criar)
              rclone mkdir "$R" && rclone mkdir "$R/data" || { echo "Não consegui acessar o armazenamento."; exit 1; }
              echo "{\"criado_em\":\"$(date -u +%FT%TZ)\"}" | rclone rcat "$R/state/init.json"
              echo "Armazenamento pronto."
              if alive; then echo "Já existe um PC ativo."; else
                gh workflow run "$WF" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
                  -f acao=ligar -f runner="$RUNNER_TIPO" -f minutos="$MINUTOS" -f nome_pc="$NOME_PC" -f migrar_aos="$MIGRAR_AOS"
                echo "Primeiro PC solicitado (ação 'ligar')."
              fi ;;
            status)
              c="$(get current)"
              if [ -z "$c" ]; then echo "Sem registro de PC."; else
                echo "$c" | jq .
                alive && echo ">> PC ATIVO" || echo ">> PC não está ativo (sem sinal recente)"
              fi
              echo "--- último backup ---"; get last_backup | jq . 2>/dev/null || echo "nenhum" ;;
            backup)           need_alive; send backup 1800 ;;
            verificar_backup)
              if alive; then send verificar_backup 1800; else
                echo "PC desligado: só dá para conferir o que está guardado."
                get last_backup | jq . 2>/dev/null || echo "Nenhum backup registrado."
                rclone size "$R/data" 2>&1 || true
              fi ;;
            migrar|reiniciar) need_alive; send "$ACAO" 2700 ;;
            desligar)         need_alive; send desligar 1800 ;;
            destruir)
              if [ "$CONFIRMAR" != "DESTRUIR" ]; then echo "Escreva DESTRUIR no campo confirmar_destruir."; exit 1; fi
              if alive; then send desligar 1800 || { echo "Não consegui desligar o PC ativo; nada foi apagado."; exit 1; }; fi
              rclone purge "$R" && echo "Backup e estado apagados." ;;
          esac

  # ---------------------------------------------------------------
  # PC Windows (ligar / restaurar, e também a nova máquina da migração)
  # ---------------------------------------------------------------
  pc:
    if: ${{ contains(fromJSON('["ligar","restaurar"]'), inputs.acao) }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    env:
      TS_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
      RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
      RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      GH_TOKEN: ${{ github.token }}
      ACAO: ${{ inputs.acao }}
      RUNNER_TIPO: ${{ inputs.runner }}
      MINUTOS: ${{ inputs.minutos }}
      NOME_PC: ${{ inputs.nome_pc }}
      MIGRAR_AOS: ${{ inputs.migrar_aos }}
      ORIGEM_RUN: ${{ inputs.origem_run }}
    steps:
      - name: Validar entradas
        shell: pwsh
        run: |
          if (-not $env:TS_KEY -or -not $env:TS_KEY.StartsWith('tskey-auth-')) {
            Write-Error 'Secret TAILSCALE_AUTH_KEY ausente ou inválido.'; exit 1
          }
          # Senha: usa o secret RDP_PASSWORD se existir; senão mantém a senha padrão de sempre.
          $senha = if ($env:RDP_PASSWORD) { $env:RDP_PASSWORD } else { 'Gamer2026Abc' }
          echo "::add-mask::$senha"
          "RDP_SENHA=$senha" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Armazenamento (backup/migração): opcional. Sem o secret, o PC liga normalmente, sem backup.
          if ($env:RCLONE_CONFIG -or $env:RCLONE_CONFIG_B64) { $st = 'STORAGE=1' } else {
            $st = 'STORAGE=0'
            Write-Host '::warning::Secret RCLONE_CONFIG ausente: o PC liga normalmente, mas SEM backup e SEM migração automática.'
          }
          $st | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $m = 0
          if (-not [int]::TryParse($env:MINUTOS, [ref]$m) -or $m -lt 1 -or $m -gt 340) {
            Write-Error 'minutos deve ser entre 1 e 340.'; exit 1
          }
          $g = 0
          if (-not [int]::TryParse($env:MIGRAR_AOS, [ref]$g) -or $g -lt 10 -or $g -gt 330) {
            Write-Error 'migrar_aos deve ser entre 10 e 330.'; exit 1
          }
          echo "::add-mask::$env:TS_KEY"
          "START_EPOCH=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "START_ISO=$((Get-Date).ToUniversalTime().ToString('o'))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Preparar ferramentas (rclone e funções)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'C:\pc' | Out-Null
          if ($env:STORAGE -eq '1') {
            $arch = if ($env:RUNNER_TIPO -eq 'windows-11-arm') { 'arm64' } else { 'amd64' }
            $zip = 'C:\pc\rclone.zip'
            Invoke-WebRequest -UseBasicParsing -Uri "https://downloads.rclone.org/rclone-current-windows-$arch.zip" -OutFile $zip
            Expand-Archive $zip -DestinationPath 'C:\pc\rc' -Force
            Copy-Item (Get-ChildItem 'C:\pc\rc' -Recurse -Filter rclone.exe | Select-Object -First 1).FullName 'C:\pc\rclone.exe'
            if ($env:RCLONE_CONFIG) { [IO.File]::WriteAllText('C:\pc\rclone.conf', ($env:RCLONE_CONFIG.Trim() + "`n")) }
            else { [IO.File]::WriteAllBytes('C:\pc\rclone.conf', [Convert]::FromBase64String($env:RCLONE_CONFIG_B64)) }
            & 'C:\pc\rclone.exe' version | Select-Object -First 1
          }
          @'
          NTUSER.DAT*
          ntuser.ini
          UsrClass.dat*
          **/AppData/Local/Temp/**
          **/AppData/Local/Microsoft/Windows/**
          **/AppData/Local/Packages/**
          **/Cache/**
          **/Code Cache/**
          **/GPUCache/**
          **/CacheStorage/**
          **/LOCK
          **/lockfile
          **/Singleton*
          $Recycle.Bin/**
          System Volume Information/**
          '@ | Set-Content 'C:\pc\exclude.txt' -Encoding ascii

          @'
          $ErrorActionPreference = 'Continue'
          $script:rc = 'C:\pc\rclone.exe'
          $script:conf = 'C:\pc\rclone.conf'
          $script:remote = $env:REMOTE
          $script:excl = 'C:\pc\exclude.txt'
          $script:ts = 'C:\Program Files\Tailscale\tailscale.exe'
          $script:lastBackup = ''

          function Log($m) { Write-Host ("[{0}] {1}" -f (Get-Date -Format 'HH:mm:ss'), $m) }
          function RC { & $script:rc --config $script:conf @args 2>&1 | Out-Host }

          function Put-State($name, $obj) {
            ($obj | ConvertTo-Json -Depth 6 -Compress) | & $script:rc --config $script:conf rcat "$($script:remote)/state/$name.json" 2>$null
            return ($LASTEXITCODE -eq 0)
          }
          function Get-State($name) {
            $t = & $script:rc --config $script:conf cat "$($script:remote)/state/$name.json" 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $t) { return $null }
            try { return (($t -join "`n") | ConvertFrom-Json) } catch { return $null }
          }
          function Del-State($name) { & $script:rc --config $script:conf deletefile "$($script:remote)/state/$name.json" 2>$null | Out-Null }

          function Get-Paths {
            $env:BACKUP_PATHS -split ';' | Where-Object { $_ } | ForEach-Object {
              [pscustomobject]@{ Local = $_; Name = (($_ -replace '^[A-Za-z]:\\', '') -replace '[\\ :]', '_') }
            }
          }
          function Get-RemoteBytes {
            $j = & $script:rc --config $script:conf size --json "$($script:remote)/data" 2>$null
            if ($LASTEXITCODE -ne 0) { return -1 }
            return [int64](($j -join '' | ConvertFrom-Json).bytes)
          }

          function Export-Extras {
            New-Item -ItemType Directory -Force 'C:\pc\extras' | Out-Null
            try {
              if (Get-Command winget -ErrorAction SilentlyContinue) {
                winget export -o 'C:\pc\extras\winget.json' --accept-source-agreements 2>&1 | Out-Null
              }
            } catch { }
            try {
              $sid = (New-Object Security.Principal.NTAccount('Rafael')).Translate([Security.Principal.SecurityIdentifier]).Value
              $loaded = Test-Path "Registry::HKEY_USERS\$sid"
              $tmp = $false
              if ($loaded) { $key = "HKU\$sid\Software"; $prefix = "HKEY_USERS\$sid" }
              else {
                reg load HKU\RafaelTmp 'C:\Users\Rafael\NTUSER.DAT' 2>&1 | Out-Null
                $tmp = ($LASTEXITCODE -eq 0); $key = 'HKU\RafaelTmp\Software'; $prefix = 'HKEY_USERS\RafaelTmp'
              }
              if ($loaded -or $tmp) {
                reg export $key 'C:\pc\extras\hkcu-software.reg' /y 2>&1 | Out-Null
                Set-Content 'C:\pc\extras\prefix.txt' $prefix
              }
              if ($tmp) { [gc]::Collect(); Start-Sleep 2; reg unload HKU\RafaelTmp 2>&1 | Out-Null }
            } catch { Log "Registro (melhor esforço): $($_.Exception.Message)" }
          }

          function Restore-Extras {
            try {
              if (Test-Path 'C:\pc\extras\hkcu-software.reg') {
                reg load HKU\RafaelRestore 'C:\Users\Rafael\NTUSER.DAT' 2>&1 | Out-Null
                if ($LASTEXITCODE -eq 0) {
                  $prefix = (Get-Content 'C:\pc\extras\prefix.txt' -Raw).Trim()
                  $txt = Get-Content 'C:\pc\extras\hkcu-software.reg' -Raw -Encoding Unicode
                  $txt = $txt.Replace($prefix, 'HKEY_USERS\RafaelRestore')
                  Set-Content 'C:\pc\extras\hkcu-restore.reg' $txt -Encoding Unicode
                  reg import 'C:\pc\extras\hkcu-restore.reg' 2>&1 | Out-Null
                  [gc]::Collect(); Start-Sleep 2
                  reg unload HKU\RafaelRestore 2>&1 | Out-Null
                  Log 'Configurações do usuário (registro) restauradas.'
                } else { Log 'Não consegui carregar o registro do usuário; configurações do registro não restauradas.' }
              }
            } catch { Log "Registro (melhor esforço): $($_.Exception.Message)" }
            try {
              if ((Test-Path 'C:\pc\extras\winget.json') -and (Get-Command winget -ErrorAction SilentlyContinue)) {
                Log 'Reinstalando aplicativos do winget (até 15 min)...'
                $p = Start-Process winget -ArgumentList 'import -i C:\pc\extras\winget.json --accept-package-agreements --accept-source-agreements --ignore-unavailable --ignore-versions' -PassThru -WindowStyle Hidden
                if (-not $p.WaitForExit(900000)) { $p.Kill(); Log 'winget excedeu o tempo; seguindo.' }
              }
            } catch { }
          }

          function Invoke-Backup {
            $ok = $true
            $stamp = Get-Date -Format 'yyyyMMdd-HHmmss'
            Export-Extras
            foreach ($p in Get-Paths) {
              if (-not (Test-Path $p.Local)) { continue }
              if (-not (Get-ChildItem $p.Local -Force -ErrorAction SilentlyContinue | Select-Object -First 1)) { Log "Pasta vazia, ignorada: $($p.Local)"; continue }
              RC sync $p.Local "$($script:remote)/data/$($p.Name)" --exclude-from $script:excl --backup-dir "$($script:remote)/_lixeira/$stamp/$($p.Name)" --transfers 8 --checkers 16 --retries 3 -q
              if ($LASTEXITCODE -ne 0) { Log "Falha no backup de $($p.Local) (código $LASTEXITCODE)"; $ok = $false }
            }
            RC sync 'C:\pc\extras' "$($script:remote)/data/_extras" -q
            if ($LASTEXITCODE -ne 0) { $ok = $false }
            RC delete "$($script:remote)/_lixeira" --min-age 7d -q
            RC rmdirs "$($script:remote)/_lixeira" --leave-root -q
            return $ok
          }

          function Test-Backup {
            $ok = $true
            foreach ($p in Get-Paths) {
              if (-not (Test-Path $p.Local)) { continue }
              RC check $p.Local "$($script:remote)/data/$($p.Name)" --one-way --size-only --exclude-from $script:excl -q
              if ($LASTEXITCODE -ne 0) { $ok = $false; Log "Verificação falhou: $($p.Local)" }
            }
            return $ok
          }

          function Save-BackupInfo($verificado) {
            $script:lastBackup = (Get-Date).ToUniversalTime().ToString('o')
            [void](Put-State 'last_backup' @{ em = $script:lastBackup; bytes = (Get-RemoteBytes); verificado = [bool]$verificado; run_id = $env:GITHUB_RUN_ID })
          }

          function Invoke-Restore {
            $need = Get-RemoteBytes
            $free = (Get-PSDrive C).Free
            if ($need -gt 0 -and $free -lt ($need * 1.1 + 2GB)) {
              Log ("Espaço insuficiente: backup {0:N1} GB, livre {1:N1} GB." -f ($need / 1GB), ($free / 1GB)); return $false
            }
            $ok = $true
            New-Item -ItemType Directory -Force 'C:\pc\extras' | Out-Null
            RC copy "$($script:remote)/data/_extras" 'C:\pc\extras' -q
            foreach ($p in Get-Paths) {
              New-Item -ItemType Directory -Force $p.Local | Out-Null
              RC copy "$($script:remote)/data/$($p.Name)" $p.Local --transfers 16 --checkers 16 --retries 3 -q
              if ($LASTEXITCODE -ne 0) { $ok = $false; Log "Falha ao restaurar $($p.Local) (código $LASTEXITCODE)" }
            }
            if (-not $ok) { return $false }
            foreach ($p in Get-Paths) {
              RC check "$($script:remote)/data/$($p.Name)" $p.Local --one-way --size-only -q
              if ($LASTEXITCODE -ne 0) { $ok = $false; Log "Verificação da restauração falhou: $($p.Local)" }
            }
            if ($ok) { Restore-Extras }
            return $ok
          }

          function Update-Heartbeat($status) {
            [void](Put-State 'current' @{
              run_id = "$env:GITHUB_RUN_ID"; run_number = "$env:GITHUB_RUN_NUMBER"; host = $env:TS_HOST; ip = $env:TS_IP
              started = $env:START_ISO; last_seen = (Get-Date).ToUniversalTime().ToString('o'); status = $status
              last_backup = $script:lastBackup; usuario = 'Rafael'
            })
          }
          '@ | Set-Content 'C:\pc\lib.ps1' -Encoding utf8

      - name: Verificar se já existe PC ativo
        shell: pwsh
        run: |
          if ($env:STORAGE -ne '1' -or $env:ORIGEM_RUN) { Write-Host 'Nada a verificar.'; exit 0 }
          . 'C:\pc\lib.ps1'
          $c = Get-State 'current'
          if ($c -and $c.status -ne 'desligado') {
            $age = ((Get-Date).ToUniversalTime() - [datetime]::Parse($c.last_seen).ToUniversalTime()).TotalMinutes
            if ($age -lt 15) {
              Write-Error "Já existe um PC ativo (run $($c.run_id), IP $($c.ip)). Use 'desligar' antes ou 'migrar'."
              exit 1
            }
          }
          if ($env:ACAO -eq 'restaurar') {
            $b = Get-State 'last_backup'
            if (-not $b) { Write-Error 'Não há backup para restaurar.'; exit 1 }
          }

      - name: Criar usuário Rafael e habilitar RDP
        shell: pwsh
        run: |
          $sec = ConvertTo-SecureString $env:RDP_SENHA -AsPlainText -Force
          New-LocalUser -Name 'Rafael' -Password $sec -FullName 'Rafael' -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group 'Administrators' -Member 'Rafael'
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'Rafael'
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop' -ErrorAction SilentlyContinue
          Set-Service -Name TermService -StartupType Automatic
          Start-Service -Name TermService
          # Cria o perfil do usuário agora, para a restauração cair no lugar certo
          try {
            $cred = New-Object System.Management.Automation.PSCredential('.\Rafael', $sec)
            Start-Process -FilePath cmd.exe -ArgumentList '/c exit 0' -Credential $cred -LoadUserProfile -WorkingDirectory 'C
